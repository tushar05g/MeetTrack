version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: tushar
      POSTGRES_PASSWORD: password
      POSTGRES_DB: meettrack
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    entrypoint: []
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://tushar:password@db:5432/meettrack
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  worker:
    build: .
    entrypoint: []
    command: ["bash", "-c", "pip uninstall -y torchvision || true && celery -A app.worker worker -B --loglevel=info --concurrency=4"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://tushar:password@db:5432/meettrack
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


  meeting-bot:
    platform: linux/amd64
    build:
      context: ./meeting-bot
      dockerfile: Dockerfile.development
    env_file:
      - ./meeting-bot/.env
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - GOOGLE_CHROME_CDP_URL=http://chrome-cdp:9223
    ports:
      - "3005:3000"
    extra_hosts:
      - "host.internal:host-gateway"
    volumes:
      - ./meeting-bot:/usr/src/app
      - ./meeting-bot/.chrome:/usr/src/app/.chrome
      - ./meeting-bot/assets/screenshots:/usr/src/app/assets/screenshots
      - ./meeting-bot/debug-videos:/usr/src/app/debug-videos
      - /usr/src/app/node_modules
    command: ["/bin/bash", "./start.sh"]
    depends_on:
      - redis
      - chrome-cdp

  chrome-cdp:
    platform: linux/amd64
    build:
      context: ./meeting-bot
      dockerfile: Dockerfile.chrome-cdp
    shm_size: "1gb"
    expose:
      - "9223"

  minio:
    image: quay.io/minio/minio
    command: server /data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data

  minio-setup:
    image: quay.io/minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/meettrack-bot-bucket || true;
      mc anonymous set public local/meettrack-bot-bucket || true;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
